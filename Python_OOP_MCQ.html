<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python OOP — MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #f7c948;
    --accent2: #4af0b0;
    --accent3: #f04a7a;
    --text: #e8eaf0;
    --muted: #6b7394;
    --correct: #4af0b0;
    --wrong: #f04a7a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(247,201,72,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(74,240,176,0.05) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown .6s ease both;
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(247,201,72,.3);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
  }
  .topics {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .topics span { color: var(--accent2); opacity: .8; }

  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown .6s .1s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta span:last-child { color: var(--accent); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 16px;
    animation: slideUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .question-card.answered::before { opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .q-code {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 22px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s ease;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(247,201,72,.06);
    transform: translateX(4px);
  }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text { font-size: 14.5px; line-height: 1.5; }
  .option.selected { border-color: var(--accent); background: rgba(247,201,72,.08); }
  .option.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #000; }

  #result-section { display: none; animation: slideUp .5s ease both; margin-top: 24px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,201,72,.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .score-display {
    font-size: clamp(52px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .score-display sub { font-size: 28px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .score-percent { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .grade-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .grade-A { background: rgba(74,240,176,.15); color: var(--correct); border: 1px solid rgba(74,240,176,.3); }
  .grade-B { background: rgba(247,201,72,.15); color: var(--accent); border: 1px solid rgba(247,201,72,.3); }
  .grade-C { background: rgba(240,74,122,.15); color: var(--wrong); border: 1px solid rgba(240,74,122,.3); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

  .review-title {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  }
  .review-list { display: flex; flex-direction: column; gap: 10px; }
  .review-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  }
  .review-item.correct { border-color: rgba(74,240,176,.25); }
  .review-item.wrong   { border-color: rgba(240,74,122,.2); }
  .ri-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); padding-top: 1px; }
  .ri-body { font-size: 13.5px; line-height: 1.5; }
  .ri-q { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .ri-ans { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .ri-ans .your  { color: var(--wrong); }
  .ri-ans .right { color: var(--correct); }
  .ri-ans .ok    { color: var(--correct); }
  .ri-icon { font-size: 18px; padding-top: 1px; }

  .retry-btn {
    margin-top: 32px; width: 100%; padding: 16px; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .04em; transition: all .2s;
  }
  .retry-btn:hover { background: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,201,72,.25); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .question-card { padding: 22px 18px; }
    .stats-row { gap: 8px; }
    .result-card { padding: 28px 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">🐍 Python OOP</div>
    <h1>Intermediate<br><span>MCQ Test</span></h1>
    <p class="subtitle">30 questions · one correct answer each</p>
    <p class="topics"><span>classes &amp; objects</span> · <span>inheritance</span> · <span>encapsulation</span> · <span>polymorphism</span> · <span>dunder methods</span> · <span>decorators</span> · <span>abstract classes</span></p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">0 / 30 answered</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="questions-container"></div>
  <div id="result-section"></div>

</div>

<script>
const questions = [
  {
    q: "What is the difference between a class and an object in Python?",
    opts: [
      "A class holds actual data values; an object is a template for creating classes",
      "A class is a blueprint that defines attributes and methods; an object is a concrete instance created from that class",
      "A class and an object are identical — they are just different names for the same thing",
      "An object defines the structure; a class is created when you call the object"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "class Dog:\n    species = 'Canine'\n    def __init__(self, name):\n        self.name = name\nd1 = Dog('Rex')\nd2 = Dog('Max')\nDog.species = 'Feline'\nprint(d1.species, d2.species)",
    opts: ["Canine Canine", "Feline Canine", "Canine Feline", "Feline Feline"],
    ans: 3
  },
  {
    q: "What happens when you assign a class variable via an instance?",
    code: "class Car:\n    wheels = 4\nc = Car()\nc.wheels = 6\nprint(Car.wheels, c.wheels)",
    opts: [
      "6 6 — the class variable is updated for all instances",
      "4 4 — instance assignment is ignored",
      "4 6 — a new instance variable shadows the class variable",
      "AttributeError"
    ],
    ans: 2
  },
  {
    q: "What is the purpose of the __init__ method in a class?",
    opts: [
      "It is called manually to reset an object's attributes",
      "It is automatically called when an object is created to initialize its instance attributes",
      "It defines class-level attributes shared by all instances",
      "It is called when the object is deleted from memory"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "class Person:\n    def __init__(self, name, age=0):\n        self.name = name\n        self.age = age\np = Person('Ali')\nprint(p.name, p.age)",
    opts: ["Ali None", "Ali 0", "TypeError", "Ali"],
    ans: 1
  },
  {
    q: "What does super().__init__() accomplish in a child class?",
    opts: [
      "It creates a new instance of the parent class independently",
      "It calls the parent class constructor to reuse its initialization logic in the child",
      "It prevents the child class from overriding any parent methods",
      "It deletes the parent class after the child is initialized"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return 'Some sound'\nclass Dog(Animal):\n    def speak(self):\n        return 'Woof!'\nd = Dog('Rex')\nprint(d.speak())",
    opts: ["Some sound", "None", "Woof!", "AttributeError"],
    ans: 2
  },
  {
    q: "Which of the following correctly describes the self parameter in Python?",
    opts: [
      "self is a Python keyword that must be named exactly 'self'",
      "self refers to the current instance of the class and is automatically passed by Python when an instance method is called",
      "self is used only in the __init__ method and not in other instance methods",
      "self refers to the class itself, not to any particular instance"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "class Shape:\n    def __init__(self, color):\n        self.color = color\n    def __str__(self):\n        return f'Shape: {self.color}'\ns = Shape('red')\nprint(s)",
    opts: [
      "<__main__.Shape object at 0x...>",
      "Shape",
      "Shape: red",
      "red"
    ],
    ans: 2
  },
  {
    q: "What does name mangling do to a private attribute __salary inside class Employee?",
    opts: [
      "Deletes the attribute entirely from the object",
      "Renames it to _Employee__salary — making direct external access harder but not impossible",
      "Makes the attribute completely inaccessible even from within the class",
      "Converts the attribute to a class variable shared by all instances"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "class Counter:\n    count = 0\n    def __init__(self):\n        Counter.count += 1\na = Counter()\nb = Counter()\nc = Counter()\nprint(Counter.count)",
    opts: ["0", "1", "3", "AttributeError"],
    ans: 2
  },
  {
    q: "What is the key difference between @staticmethod and @classmethod?",
    opts: [
      "@staticmethod receives cls as first argument; @classmethod receives self",
      "@staticmethod receives neither self nor cls; @classmethod receives cls (the class itself)",
      "Both receive self as first argument but @classmethod also receives cls",
      "@staticmethod can modify class variables; @classmethod cannot"
    ],
    ans: 1
  },
  {
    q: "What will the following code raise?",
    code: "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): pass\ns = Shape()",
    opts: ["SyntaxError", "AttributeError", "TypeError", "NotImplementedError"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "class Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __add__(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n    def __str__(self):\n        return f'({self.x},{self.y})'\nv1 = Vector(1, 2)\nv2 = Vector(3, 4)\nprint(v1 + v2)",
    opts: ["(1,2)(3,4)", "TypeError", "(4,6)", "Vector(4,6)"],
    ans: 2
  },
  {
    q: "Which type of inheritance does the following represent?",
    code: "class A: pass\nclass B(A): pass\nclass C(B): pass",
    opts: [
      "Multiple inheritance",
      "Hierarchical inheritance",
      "Multilevel inheritance",
      "Hybrid inheritance"
    ],
    ans: 2
  },
  {
    q: "What is duck typing in Python?",
    opts: [
      "Python checks the exact class type before calling a method on an object",
      "An object is used based on whether it has the required behavior (methods/attributes), not based on its class type",
      "Python automatically converts objects to the required type before method calls",
      "Duck typing only applies to built-in types like str and list"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "class Maths:\n    @staticmethod\n    def add(a, b):\n        return a + b\nprint(Maths.add(10, 5))",
    opts: ["TypeError — no instance created", "None", "15", "AttributeError"],
    ans: 2
  },
  {
    q: "What is the purpose of the @property decorator in a class?",
    opts: [
      "It converts a method into a class variable shared across all instances",
      "It allows a method to be accessed like an attribute, enabling controlled read access to private data",
      "It makes a method static so it doesn't require self",
      "It prevents any subclass from overriding the method"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "class Animal:\n    def speak(self): return 'Generic'\nclass Dog(Animal):\n    def speak(self): return 'Woof'\nclass Cat(Animal):\n    def speak(self): return 'Meow'\nfor a in [Dog(), Cat(), Animal()]:\n    print(a.speak(), end=' ')",
    opts: ["Generic Generic Generic", "Woof Meow Generic", "Woof Meow Woof", "TypeError"],
    ans: 1
  },
  {
    q: "What does isinstance(obj, ParentClass) return when obj is an instance of a child class?",
    opts: [
      "False — isinstance only returns True for the exact class, not parent classes",
      "True — isinstance returns True for the object's class AND all its parent classes",
      "TypeError",
      "It depends on whether the child class overrides any parent methods"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "class BankAccount:\n    def __init__(self, balance):\n        self.__balance = balance\nacc = BankAccount(1000)\nprint(acc.__balance)",
    opts: ["1000", "None", "AttributeError", "0"],
    ans: 2
  },
  {
    q: "Which dunder method is triggered when you use the len() function on a custom object?",
    opts: ["__size__(self)", "__count__(self)", "__length__(self)", "__len__(self)"],
    ans: 3
  },
  {
    q: "What is the correct way to call the parent class's __init__ in a child class named Dog that inherits from Animal?",
    opts: [
      "Animal.__init__(name)",
      "parent.__init__(self, name)",
      "super().__init__(name)",
      "self.__init__(name)"
    ],
    ans: 2
  },
  {
    q: "What does the following class method pattern accomplish?",
    code: "class Employee:\n    @classmethod\n    def from_string(cls, s):\n        name, age = s.split('-')\n        return cls(name, int(age))",
    opts: [
      "It modifies a class variable using the string input",
      "It acts as a factory method — creating a new instance of the class from a formatted string",
      "It converts the class itself into a string representation",
      "It defines an alternative __init__ that replaces the original"
    ],
    ans: 1
  },
  {
    q: "What is method overriding in Python OOP?",
    opts: [
      "Defining two methods with the same name but different parameter counts in the same class",
      "A child class providing its own implementation of a method already defined in the parent class",
      "A static method that replaces an instance method in the same class",
      "Using super() to call a parent method from a child class"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "class A:\n    def greet(self):\n        return 'Hello from A'\nclass B(A):\n    def greet(self):\n        return super().greet() + ' and B'\nb = B()\nprint(b.greet())",
    opts: ["Hello from A", "Hello from A and B", "Hello from B", "AttributeError"],
    ans: 1
  },
  {
    q: "What is the purpose of an abstract method in Python?",
    opts: [
      "To provide a default implementation that all subclasses must use without modification",
      "To declare a method with no body that every concrete subclass MUST implement",
      "To make a method private and inaccessible outside the class",
      "To create a method that automatically runs when the class is imported"
    ],
    ans: 1
  },
  {
    q: "Which of the following access modifiers in Python is enforced through name mangling?",
    opts: [
      "Public (no underscore)",
      "Protected (single underscore _name)",
      "Private (double underscore __name)",
      "All three are enforced equally by Python's interpreter"
    ],
    ans: 2
  },
  {
    q: "What will the following code output?",
    code: "class Box:\n    def __init__(self, vol):\n        self.vol = vol\n    def __lt__(self, other):\n        return self.vol < other.vol\nb1 = Box(10)\nb2 = Box(20)\nprint(b1 < b2)",
    opts: ["False", "TypeError", "True", "NotImplemented"],
    ans: 2
  },
  {
    q: "What is the key principle of encapsulation in OOP?",
    opts: [
      "A class can inherit methods and attributes from multiple parent classes simultaneously",
      "The same method name can produce different results based on the object type",
      "Data and the methods that operate on it are bundled together, with internal details hidden from outside access",
      "A class can never be instantiated directly and must always be subclassed"
    ],
    ans: 2
  }
];

const labels = ['A','B','C','D'];
const userAnswers = new Array(questions.length).fill(null);
let answered = 0;
let examDone = false;

const container = document.getElementById('questions-container');
const resultSec = document.getElementById('result-section');
const progFill  = document.getElementById('progress-fill');
const progLabel = document.getElementById('prog-label');
const progPct   = document.getElementById('prog-pct');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildQuestions() {
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const optsHtml = q.opts.map((opt, oi) => `
      <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${labels[oi]}</div>
        <div class="option-text">${escHtml(opt)}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${escHtml(q.q)}</div>
      ${codeBlock}
      <div class="options" id="opts-${qi}">${optsHtml}</div>`;
    container.appendChild(card);
  });
}

function selectOption(qi, oi) {
  if (examDone) return;
  const wasNull = userAnswers[qi] === null;
  userAnswers[qi] = oi;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.remove('selected');
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`card-${qi}`).classList.add('answered');

  if (wasNull) answered++;
  updateProgress();

  if (answered === questions.length) {
    examDone = true;
    setTimeout(showResult, 400);
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = `${answered} / ${questions.length} answered`;
  progPct.textContent = pct + '%';
}

function showResult() {
  let correct = 0;
  questions.forEach((q, i) => { if (userAnswers[i] === q.ans) correct++; });
  const wrong = questions.length - correct;
  const pct = Math.round((correct / questions.length) * 100);

  let grade, gradeClass, gradeMsg;
  if (pct >= 80)      { grade = '🏆 Excellent'; gradeClass = 'grade-A'; gradeMsg = 'Outstanding performance!'; }
  else if (pct >= 60) { grade = '✅ Good';       gradeClass = 'grade-B'; gradeMsg = 'Solid understanding!'; }
  else                { grade = '📚 Keep Going'; gradeClass = 'grade-C'; gradeMsg = 'More practice needed.'; }

  const reviewItems = questions.map((q, i) => {
    const isRight = userAnswers[i] === q.ans;
    const userLetter = labels[userAnswers[i]];
    const corrLetter = labels[q.ans];
    const qShort = q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q;
    const ansHtml = isRight
      ? `<span class="ok">✓ ${userLetter}: ${escHtml(q.opts[userAnswers[i]])}</span>`
      : `<span class="your">✗ You: ${userLetter} — ${escHtml(q.opts[userAnswers[i]])}</span><br><span class="right">✓ Correct: ${corrLetter} — ${escHtml(q.opts[q.ans])}</span>`;
    return `
      <div class="review-item ${isRight ? 'correct' : 'wrong'}">
        <div class="ri-num">Q${i+1}</div>
        <div class="ri-body">
          <div class="ri-q">${escHtml(qShort)}</div>
          <div class="ri-ans">${ansHtml}</div>
        </div>
        <div class="ri-icon">${isRight ? '✅' : '❌'}</div>
      </div>`;
  }).join('');

  resultSec.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Your Result</div>
        <div class="score-display">${correct}<sub> / ${questions.length}</sub></div>
        <div class="score-percent">${pct}% correct — ${gradeMsg}</div>
        <span class="grade-badge ${gradeClass}">${grade}</span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val c">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-val w">${wrong}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat-box"><div class="stat-val s">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div class="review-title">Answer Review</div>
      <div class="review-list">${reviewItems}</div>
      <button class="retry-btn" onclick="retryExam()">↺ Retry Exam</button>
    </div>`;

  resultSec.style.display = 'block';
  resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryExam() {
  userAnswers.fill(null);
  answered = 0;
  examDone = false;
  updateProgress();
  resultSec.style.display = 'none';
  resultSec.innerHTML = '';
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(el => el.classList.remove('answered'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuestions();
</script>
</body>
</html>
