<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Variables — MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #f7c948;
    --accent2: #4af0b0;
    --accent3: #f04a7a;
    --text: #e8eaf0;
    --muted: #6b7394;
    --correct: #4af0b0;
    --wrong: #f04a7a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(247,201,72,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(74,240,176,0.05) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown .6s ease both;
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(247,201,72,.3);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
  }
  .topics {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .topics span { color: var(--accent2); opacity: .8; }

  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown .6s .1s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta span:last-child { color: var(--accent); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 16px;
    animation: slideUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .question-card.answered::before { opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .q-code {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 22px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s ease;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(247,201,72,.06);
    transform: translateX(4px);
  }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text { font-size: 14.5px; line-height: 1.5; }
  .option.selected { border-color: var(--accent); background: rgba(247,201,72,.08); }
  .option.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #000; }

  #result-section { display: none; animation: slideUp .5s ease both; margin-top: 24px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,201,72,.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .score-display {
    font-size: clamp(52px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .score-display sub { font-size: 28px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .score-percent { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .grade-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .grade-A { background: rgba(74,240,176,.15); color: var(--correct); border: 1px solid rgba(74,240,176,.3); }
  .grade-B { background: rgba(247,201,72,.15); color: var(--accent); border: 1px solid rgba(247,201,72,.3); }
  .grade-C { background: rgba(240,74,122,.15); color: var(--wrong); border: 1px solid rgba(240,74,122,.3); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

  .review-title {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  }
  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .review-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .review-item.correct { border-left: 3px solid var(--correct); }
  .review-item.wrong { border-left: 3px solid var(--wrong); }
  .ri-num {
    flex-shrink: 0; width: 36px; height: 36px;
    background: var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  }
  .ri-body { flex: 1; }
  .ri-q { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .ri-ans { font-size: 13px; line-height: 1.6; }
  .ri-ans .ok { color: var(--correct); }
  .ri-ans .your { color: var(--wrong); }
  .ri-ans .right { color: var(--correct); }
  .ri-icon { font-size: 18px; flex-shrink: 0; }

  .retry-btn {
    width: 100%; padding: 14px;
    background: var(--accent); color: #000;
    border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .retry-btn:hover { background: var(--accent2); transform: translateY(-2px); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    body { padding: 24px 16px 60px; }
    .question-card { padding: 24px 20px; }
    .result-card { padding: 32px 24px; }
    .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">Intermediate Level</div>
    <h1>Python <span>Variables</span></h1>
    <div class="subtitle">30-Question MCQ Assessment</div>
    <div class="topics">Topics: <span>Assignment • Naming • Dynamic Typing • Scope • Conversions • Formatting</span></div>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">0 / 30 answered</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="questions-container"></div>
  <div id="result-section"></div>
</div>

<script>
const questions = [
  {
    q: "What will be the output of the following code?",
    code: "x = 10\ny = x\nx = 'hello'\nprint(y)",
    opts: ["hello", "10", "None", "NameError"],
    ans: 1
  },
  {
    q: "Which of the following variable names is INVALID in Python?",
    opts: ["_total_score", "total_score_1", "1st_score", "score_1st"],
    ans: 2
  },
  {
    q: "What is the result of the following code?",
    code: "a, *b, c = [10, 20, 30, 40, 50]\nprint(b)",
    opts: ["[20, 30, 40]", "[10, 20, 30, 40]", "[30, 40, 50]", "(20, 30, 40)"],
    ans: 0
  },
  {
    q: "Which statement correctly describes dynamic typing in Python?",
    opts: [
      "A variable must be declared with a type before use",
      "A variable's type is fixed after first assignment",
      "A variable can hold different types at different times",
      "Python converts all variables to strings internally"
    ],
    ans: 2
  },
  {
    q: "What does int(3.9) return in Python?",
    opts: ["4", "3.0", "3", "ValueError"],
    ans: 2
  },
  {
    q: "What will the following code print?",
    code: "a = b = c = 50\na = 100\nprint(b)",
    opts: ["100", "50", "None", "UnboundLocalError"],
    ans: 1
  },
  {
    q: "Which operator checks if two variables point to the SAME object in memory?",
    opts: ["==", "!=", "is", "equals()"],
    ans: 2
  },
  {
    q: "What will the following code raise?",
    code: "x = 5\ndel x\nprint(x)",
    opts: ["None", "0", "NameError", "TypeError"],
    ans: 2
  },
  {
    q: "What is the output of this code?",
    code: "x = 5\nx += 3\nx *= 2\nprint(x)",
    opts: ["13", "16", "11", "26"],
    ans: 1
  },
  {
    q: "Which of the following correctly describes the global keyword in Python?",
    opts: [
      "It is required both when reading and modifying a global variable inside a function",
      "It is only required when modifying a global variable inside a function",
      "It prevents a function from accessing global variables",
      "It deletes the global variable after the function returns"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "x = 'global'\ndef f():\n    x = 'local'\nf()\nprint(x)",
    opts: ["local", "global", "None", "UnboundLocalError"],
    ans: 1
  },
  {
    q: "What does bool('') return?",
    opts: ["True", "False", "None", "TypeError"],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "name = 'Ali'\nage = 25\nprint(f'Name: {name}, Age: {age * 2}')",
    opts: [
      "Name: Ali, Age: age * 2",
      "Name: Ali, Age: 25",
      "Name: Ali, Age: 50",
      "TypeError"
    ],
    ans: 2
  },
  {
    q: "Which of the following will raise a ValueError?",
    opts: ["int('42')", "float('3.14')", "float('abc')", "str(100)"],
    ans: 2
  },
  {
    q: "What does the id() function return in Python?",
    opts: [
      "The data type of the variable",
      "The value stored in the variable",
      "The memory address of the object the variable references",
      "The size of the object in bytes"
    ],
    ans: 2
  },
  {
    q: "What will the following code print?",
    code: "def fn():\n    return 99\nvar = fn\nprint(var())",
    opts: ["fn", "None", "99", "TypeError"],
    ans: 2
  },
  {
    q: "Which of the following is the PEP 8 recommended naming convention for a constant?",
    opts: ["myConstant", "my_constant", "MY_CONSTANT", "MyConstant"],
    ans: 2
  },
  {
    q: "What is the output of this code?",
    code: "a, b = 5, 10\na, b = b, a\nprint(a, b)",
    opts: ["5 10", "10 5", "10 10", "5 5"],
    ans: 1
  },
  {
    q: "What will happen if you try to modify a global variable inside a function WITHOUT using the global keyword?",
    opts: [
      "The global variable is modified successfully",
      "Python raises a NameError",
      "Python raises an UnboundLocalError",
      "Python creates a new global variable"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "x = [1, 2, 3]\ny = x\ndel x[1]\nprint(y)",
    opts: ["[1, 2, 3]", "[1, 3]", "[2, 3]", "NameError"],
    ans: 1
  },
  {
    q: "Which string formatting method is exclusive to Python 3.6 and above?",
    opts: ["% formatting", "str.format()", "f-strings", "+ concatenation"],
    ans: 2
  },
  {
    q: "What does set([1, 1, 2, 3, 2]) return?",
    opts: ["[1, 2, 3]", "{1, 1, 2, 3}", "{1, 2, 3}", "(1, 2, 3)"],
    ans: 2
  },
  {
    q: "What will the following code output?",
    code: "score = 0\ndef check():\n    global score\n    score = 100\ncheck()\nprint(score)",
    opts: ["0", "None", "UnboundLocalError", "100"],
    ans: 3
  },
  {
    q: "What is the output of this code?",
    code: "val = '5'\nresult = int(val) + float(val)\nprint(result)",
    opts: ["'55.0'", "10", "10.0", "TypeError"],
    ans: 2
  },
  {
    q: "Which of the following is a correct use of the single underscore _ variable?",
    opts: [
      "To declare a private variable accessible only within a class",
      "As a throwaway variable when the value is not needed",
      "To indicate a constant that should not be modified",
      "To trigger name mangling in a class"
    ],
    ans: 1
  },
  {
    q: "What will the following f-string expression print?",
    code: "pi = 3.14159\nprint(f'{pi:.2f}')",
    opts: ["3.14159", "3.14", "3.1", "pi:.2f"],
    ans: 1
  },
  {
    q: "Which of the following statements about local variables is TRUE?",
    opts: [
      "A local variable persists in memory after the function returns",
      "A local variable can be accessed from outside the function using its name",
      "A local variable with the same name as a global variable modifies the global",
      "A local variable is created when the function is called and destroyed when it returns"
    ],
    ans: 3
  },
  {
    q: "What is the output of the following code?",
    code: "def greet():\n    pass\nresult = greet()\nprint(result)",
    opts: ["greet", "0", "None", "TypeError"],
    ans: 2
  },
  {
    q: "What will the following code print?",
    code: "items = list('code')\nprint(items)",
    opts: ["['code']", "['c', 'o', 'd', 'e']", "('c', 'o', 'd', 'e')", "{'c', 'o', 'd', 'e'}"],
    ans: 1
  },
  {
    q: "Given the following code, what does callable(fn) return?",
    code: "def fn():\n    return 1\nfn = fn()",
    opts: ["True", "False", "1", "TypeError"],
    ans: 1
  }
];

const labels = ['A','B','C','D'];
const userAnswers = new Array(questions.length).fill(null);
let answered = 0;
let examDone = false;

const container = document.getElementById('questions-container');
const resultSec = document.getElementById('result-section');
const progFill  = document.getElementById('progress-fill');
const progLabel = document.getElementById('prog-label');
const progPct   = document.getElementById('prog-pct');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildQuestions() {
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const optsHtml = q.opts.map((opt, oi) => `
      <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${labels[oi]}</div>
        <div class="option-text">${escHtml(opt)}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${escHtml(q.q)}</div>
      ${codeBlock}
      <div class="options" id="opts-${qi}">${optsHtml}</div>`;
    container.appendChild(card);
  });
}

function selectOption(qi, oi) {
  if (examDone) return;
  const wasNull = userAnswers[qi] === null;
  userAnswers[qi] = oi;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.remove('selected');
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`card-${qi}`).classList.add('answered');

  if (wasNull) answered++;
  updateProgress();

  if (answered === questions.length) {
    examDone = true;
    setTimeout(showResult, 400);
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = `${answered} / ${questions.length} answered`;
  progPct.textContent = pct + '%';
}

function showResult() {
  let correct = 0;
  questions.forEach((q, i) => { if (userAnswers[i] === q.ans) correct++; });
  const wrong = questions.length - correct;
  const pct = Math.round((correct / questions.length) * 100);

  let grade, gradeClass, gradeMsg;
  if (pct >= 80)      { grade = '🏆 Excellent'; gradeClass = 'grade-A'; gradeMsg = 'Outstanding performance!'; }
  else if (pct >= 60) { grade = '✅ Good';       gradeClass = 'grade-B'; gradeMsg = 'Solid understanding!'; }
  else                { grade = '📚 Keep Going'; gradeClass = 'grade-C'; gradeMsg = 'More practice needed.'; }

  const reviewItems = questions.map((q, i) => {
    const isRight = userAnswers[i] === q.ans;
    const userLetter = labels[userAnswers[i]];
    const corrLetter = labels[q.ans];
    const qShort = q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q;
    const ansHtml = isRight
      ? `<span class="ok">✓ ${userLetter}: ${escHtml(q.opts[userAnswers[i]])}</span>`
      : `<span class="your">✗ You: ${userLetter} — ${escHtml(q.opts[userAnswers[i]])}</span><br><span class="right">✓ Correct: ${corrLetter} — ${escHtml(q.opts[q.ans])}</span>`;
    return `
      <div class="review-item ${isRight ? 'correct' : 'wrong'}">
        <div class="ri-num">Q${i+1}</div>
        <div class="ri-body">
          <div class="ri-q">${escHtml(qShort)}</div>
          <div class="ri-ans">${ansHtml}</div>
        </div>
        <div class="ri-icon">${isRight ? '✅' : '❌'}</div>
      </div>`;
  }).join('');

  resultSec.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Your Result</div>
        <div class="score-display">${correct}<sub> / ${questions.length}</sub></div>
        <div class="score-percent">${pct}% correct — ${gradeMsg}</div>
        <span class="grade-badge ${gradeClass}">${grade}</span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val c">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-val w">${wrong}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat-box"><div class="stat-val s">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div class="review-title">Answer Review</div>
      <div class="review-list">${reviewItems}</div>
      <button class="retry-btn" onclick="retryExam()">↺ Retry Exam</button>
    </div>`;

  resultSec.style.display = 'block';
  resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryExam() {
  userAnswers.fill(null);
  answered = 0;
  examDone = false;
  updateProgress();
  resultSec.style.display = 'none';
  resultSec.innerHTML = '';
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(el => el.classList.remove('answered'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuestions();
</script>
</body>
</html>
