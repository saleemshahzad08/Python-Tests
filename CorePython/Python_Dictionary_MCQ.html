<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Dictionary — MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #f7c948;
    --accent2: #4af0b0;
    --accent3: #f04a7a;
    --text: #e8eaf0;
    --muted: #6b7394;
    --correct: #4af0b0;
    --wrong: #f04a7a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(247,201,72,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(74,240,176,0.05) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown .6s ease both;
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(247,201,72,.3);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
  }
  .topics {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .topics span { color: var(--accent2); opacity: .8; }

  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown .6s .1s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta span:last-child { color: var(--accent); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 16px;
    animation: slideUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .question-card.answered::before { opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .q-code {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 22px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s ease;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(247,201,72,.06);
    transform: translateX(4px);
  }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text { font-size: 14.5px; line-height: 1.5; }
  .option.selected { border-color: var(--accent); background: rgba(247,201,72,.08); }
  .option.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #000; }

  #result-section { display: none; animation: slideUp .5s ease both; margin-top: 24px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,201,72,.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .score-display {
    font-size: clamp(52px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .score-display sub { font-size: 28px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .score-percent { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .grade-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .grade-A { background: rgba(74,240,176,.15); color: var(--correct); border: 1px solid rgba(74,240,176,.3); }
  .grade-B { background: rgba(247,201,72,.15); color: var(--accent); border: 1px solid rgba(247,201,72,.3); }
  .grade-C { background: rgba(240,74,122,.15); color: var(--wrong); border: 1px solid rgba(240,74,122,.3); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

  .review-title {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  }
  .review-list { display: flex; flex-direction: column; gap: 10px; }
  .review-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  }
  .review-item.correct { border-color: rgba(74,240,176,.25); }
  .review-item.wrong   { border-color: rgba(240,74,122,.2); }
  .ri-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); padding-top: 1px; }
  .ri-body { font-size: 13.5px; line-height: 1.5; }
  .ri-q { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .ri-ans { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .ri-ans .your  { color: var(--wrong); }
  .ri-ans .right { color: var(--correct); }
  .ri-ans .ok    { color: var(--correct); }
  .ri-icon { font-size: 18px; padding-top: 1px; }

  .retry-btn {
    margin-top: 32px; width: 100%; padding: 16px; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .04em; transition: all .2s;
  }
  .retry-btn:hover { background: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,201,72,.25); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .question-card { padding: 22px 18px; }
    .stats-row { gap: 8px; }
    .result-card { padding: 28px 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">🐍 Python Dictionary</div>
    <h1>Intermediate<br><span>MCQ Test</span></h1>
    <p class="subtitle">30 questions · one correct answer each</p>
    <p class="topics"><span>dict methods</span> · <span>comprehensions</span> · <span>get/pop/update</span> · <span>shallow vs deep copy</span> · <span>grouping</span> · <span>merging</span> · <span>iteration</span></p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">0 / 30 answered</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="questions-container"></div>
  <div id="result-section"></div>

</div>

<script>
const questions = [
  {
    q: "What will the following code output?",
    code: "d = {'a': 1, 'b': 2, 'a': 99}\nprint(len(d))",
    opts: ["3", "2", "KeyError", "1"],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d = {'x': 10, 'y': 20}\nprint(d.get('z', -1))",
    opts: ["None", "KeyError", "0", "-1"],
    ans: 3
  },
  {
    q: "Which of the following correctly creates a dictionary from two lists?",
    code: "keys = ['a', 'b', 'c']\nvals = [1, 2, 3]",
    opts: [
      "dict(keys, vals)",
      "dict(zip(keys, vals))",
      "{keys: vals}",
      "dict([keys, vals])"
    ],
    ans: 1
  },
  {
    q: "What does dict.fromkeys(['x', 'y', 'z'], 0) return?",
    opts: [
      "{'x': None, 'y': None, 'z': None}",
      "{'x': 0, 'y': 0, 'z': 0}",
      "{0: 'x', 0: 'y', 0: 'z'}",
      "KeyError"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d = {'a': 1, 'b': 2, 'c': 3}\nval = d.pop('b')\nprint(val, d)",
    opts: [
      "None {'a': 1, 'c': 3}",
      "2 {'a': 1, 'b': 2, 'c': 3}",
      "2 {'a': 1, 'c': 3}",
      "KeyError"
    ],
    ans: 2
  },
  {
    q: "What is the difference between d.pop('key') and d.pop('key', None)?",
    opts: [
      "Both raise KeyError if the key is missing",
      "d.pop('key') raises KeyError if missing; d.pop('key', None) returns None safely",
      "d.pop('key', None) raises KeyError; d.pop('key') returns None",
      "Both return None if the key is missing"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "d = {'a': 1, 'b': 2}\nd.update({'b': 99, 'c': 3})\nprint(d)",
    opts: [
      "{'a': 1, 'b': 2, 'c': 3}",
      "{'a': 1, 'b': 99}",
      "{'a': 1, 'b': 99, 'c': 3}",
      "KeyError"
    ],
    ans: 2
  },
  {
    q: "What does the following pattern accomplish?",
    code: "d = {}\nfor word in ['cat', 'dog', 'cat', 'bird', 'dog', 'cat']:\n    d[word] = d.get(word, 0) + 1\nprint(d)",
    opts: [
      "Creates a dictionary with words as values and counts as keys",
      "Counts the frequency of each word and stores it as key:count",
      "Removes duplicate words from the list",
      "Raises KeyError on the second occurrence of each word"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d = {'a': 1, 'b': 2, 'c': 3}\nprint(list(d.items()))",
    opts: [
      "['a', 'b', 'c']",
      "[1, 2, 3]",
      "[('a', 1), ('b', 2), ('c', 3)]",
      "{'a': 1, 'b': 2, 'c': 3}"
    ],
    ans: 2
  },
  {
    q: "What does setdefault() do when the key ALREADY exists in the dictionary?",
    code: "d = {'a': 100}\nresult = d.setdefault('a', 999)\nprint(result, d)",
    opts: [
      "Overwrites the value with 999 and returns 999",
      "Returns 100 and leaves the dictionary unchanged",
      "Returns None and leaves the dictionary unchanged",
      "Raises KeyError"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following dictionary comprehension?",
    code: "d = {'a': 1, 'b': -2, 'c': 3, 'd': -4}\nresult = {k: v for k, v in d.items() if v > 0}\nprint(result)",
    opts: [
      "{'a': 1, 'b': -2, 'c': 3, 'd': -4}",
      "{'b': -2, 'd': -4}",
      "{'a': 1, 'c': 3}",
      "{1: 'a', 3: 'c'}"
    ],
    ans: 2
  },
  {
    q: "What does the following code output?",
    code: "d = {'name': 'Ali', 'scores': {'math': 90, 'eng': 85}}\nprint(d.get('scores', {}).get('math'))",
    opts: ["KeyError", "None", "90", "{'math': 90, 'eng': 85}"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "d = {'a': 1, 'b': 2, 'c': 3}\nk, v = d.popitem()\nprint(k, v)",
    opts: [
      "a 1 (always the first inserted pair)",
      "The last inserted key-value pair",
      "A random key-value pair",
      "KeyError"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d1 = {'a': 1, 'b': 2}\nd2 = {'b': 99, 'c': 3}\nd3 = d1 | d2\nprint(d3)",
    opts: [
      "{'a': 1, 'b': 2, 'c': 3}",
      "{'a': 1, 'b': 99, 'c': 3}",
      "{'a': 1, 'b': 2, 'b': 99, 'c': 3}",
      "SyntaxError"
    ],
    ans: 1
  },
  {
    q: "What is the key difference between d.copy() and copy.deepcopy(d) for a nested dictionary?",
    opts: [
      "Both create fully independent copies — there is no difference",
      "d.copy() creates a shallow copy where nested mutable objects are still shared; deepcopy creates fully independent copies",
      "deepcopy() is only for flat dictionaries; copy() handles nested ones",
      "d.copy() is slower than deepcopy() for nested structures"
    ],
    ans: 1
  },
  {
    q: "What happens when you do d2 = d1 (assignment) with a dictionary?",
    code: "d1 = {'a': 1}\nd2 = d1\nd2['b'] = 99\nprint(d1)",
    opts: [
      "{'a': 1} — d1 is unaffected",
      "{'a': 1, 'b': 99} — both point to the same object",
      "KeyError",
      "{'b': 99}"
    ],
    ans: 1
  },
  {
    q: "What does the following grouping pattern produce?",
    code: "items = [('fruit', 'apple'), ('veg', 'carrot'), ('fruit', 'mango')]\nd = {}\nfor cat, item in items:\n    d.setdefault(cat, []).append(item)\nprint(d)",
    opts: [
      "{'fruit': 'mango', 'veg': 'carrot'}",
      "{'fruit': ['apple', 'mango'], 'veg': ['carrot']}",
      "[('fruit', 'apple'), ('veg', 'carrot'), ('fruit', 'mango')]",
      "KeyError"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following dictionary comprehension?",
    code: "d = {'x': 1, 'y': 2, 'z': 3}\ninv = {v: k for k, v in d.items()}\nprint(inv)",
    opts: [
      "{'x': 1, 'y': 2, 'z': 3}",
      "{1: 'x', 2: 'y', 3: 'z'}",
      "{'1': 'x', '2': 'y', '3': 'z'}",
      "TypeError"
    ],
    ans: 1
  },
  {
    q: "What does the 'in' operator check when used with a dictionary?",
    code: "d = {'a': 1, 'b': 2}\nprint(1 in d)",
    opts: [
      "True — because 1 is a value in the dictionary",
      "False — because in checks only keys",
      "True — because in checks both keys and values",
      "KeyError"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d = {'a': 5, 'b': 1, 'c': 3}\nprint(min(d, key=d.get))",
    opts: ["1", "'a'", "'b'", "TypeError"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "d = {}\nd.clear()\nprint(d, type(d))",
    opts: [
      "None <class 'NoneType'>",
      "{} <class 'dict'>",
      "NameError",
      "set() <class 'set'>"
    ],
    ans: 1
  },
  {
    q: "Which of the following is the SAFEST way to remove a key from a dictionary?",
    opts: [
      "del d['key']",
      "d.popitem()",
      "d.pop('key', None)",
      "d.clear()"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "lst = [{'name': 'Ali', 'age': 25}, {'name': 'Sara'}, {'name': 'Zain', 'age': 30}]\nages = [d.get('age') for d in lst if 'age' in d]\nprint(ages)",
    opts: [
      "[25, None, 30]",
      "[25, 30]",
      "[{'name': 'Ali', 'age': 25}, {'name': 'Zain', 'age': 30}]",
      "KeyError"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "import copy\noriginal = {'a': [1, 2, 3]}\nshallow = original.copy()\nshallow['a'].append(99)\nprint(original['a'])",
    opts: ["[1, 2, 3]", "[1, 2, 3, 99]", "KeyError", "None"],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "d = {'p': 3, 'q': 1, 'r': 2}\nfor k in sorted(d):\n    print(k, end=' ')",
    opts: ["p q r", "q r p", "1 2 3", "r q p"],
    ans: 0
  },
  {
    q: "What does the following code return?",
    code: "d = {'a': 1, 'b': 2, 'c': 3}\nprint(next(iter(d)))",
    opts: ["1", "('a', 1)", "'a'", "TypeError"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "sq = {x: x**2 for x in range(1, 6)}\nprint(sq[4])",
    opts: ["4", "8", "16", "KeyError"],
    ans: 2
  },
  {
    q: "What is the correct way to iterate over both keys and values of a dictionary?",
    opts: [
      "for k, v in d:",
      "for k, v in d.keys():",
      "for k, v in d.items():",
      "for k in d.values():"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following when merging two dicts with a duplicate key?",
    code: "d1 = {'a': 1, 'b': 2}\nd2 = {'b': 50, 'c': 3}\nresult = {**d1, **d2}\nprint(result['b'])",
    opts: ["2", "52", "50", "KeyError"],
    ans: 2
  },
  {
    q: "Which of the following correctly describes how Python dictionaries maintain key uniqueness?",
    opts: [
      "Assigning a duplicate key raises a KeyError",
      "Assigning a duplicate key silently ignores the new value",
      "Assigning a duplicate key overwrites the existing value — only the latest value is kept",
      "Dictionaries allow duplicate keys but store them as a list of values"
    ],
    ans: 2
  }
];

const labels = ['A','B','C','D'];
const userAnswers = new Array(questions.length).fill(null);
let answered = 0;
let examDone = false;

const container = document.getElementById('questions-container');
const resultSec = document.getElementById('result-section');
const progFill  = document.getElementById('progress-fill');
const progLabel = document.getElementById('prog-label');
const progPct   = document.getElementById('prog-pct');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildQuestions() {
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const optsHtml = q.opts.map((opt, oi) => `
      <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${labels[oi]}</div>
        <div class="option-text">${escHtml(opt)}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${escHtml(q.q)}</div>
      ${codeBlock}
      <div class="options" id="opts-${qi}">${optsHtml}</div>`;
    container.appendChild(card);
  });
}

function selectOption(qi, oi) {
  if (examDone) return;
  const wasNull = userAnswers[qi] === null;
  userAnswers[qi] = oi;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.remove('selected');
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`card-${qi}`).classList.add('answered');

  if (wasNull) answered++;
  updateProgress();

  if (answered === questions.length) {
    examDone = true;
    setTimeout(showResult, 400);
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = `${answered} / ${questions.length} answered`;
  progPct.textContent = pct + '%';
}

function showResult() {
  let correct = 0;
  questions.forEach((q, i) => { if (userAnswers[i] === q.ans) correct++; });
  const wrong = questions.length - correct;
  const pct = Math.round((correct / questions.length) * 100);

  let grade, gradeClass, gradeMsg;
  if (pct >= 80)      { grade = '🏆 Excellent'; gradeClass = 'grade-A'; gradeMsg = 'Outstanding performance!'; }
  else if (pct >= 60) { grade = '✅ Good';       gradeClass = 'grade-B'; gradeMsg = 'Solid understanding!'; }
  else                { grade = '📚 Keep Going'; gradeClass = 'grade-C'; gradeMsg = 'More practice needed.'; }

  const reviewItems = questions.map((q, i) => {
    const isRight = userAnswers[i] === q.ans;
    const userLetter = labels[userAnswers[i]];
    const corrLetter = labels[q.ans];
    const qShort = q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q;
    const ansHtml = isRight
      ? `<span class="ok">✓ ${userLetter}: ${escHtml(q.opts[userAnswers[i]])}</span>`
      : `<span class="your">✗ You: ${userLetter} — ${escHtml(q.opts[userAnswers[i]])}</span><br><span class="right">✓ Correct: ${corrLetter} — ${escHtml(q.opts[q.ans])}</span>`;
    return `
      <div class="review-item ${isRight ? 'correct' : 'wrong'}">
        <div class="ri-num">Q${i+1}</div>
        <div class="ri-body">
          <div class="ri-q">${escHtml(qShort)}</div>
          <div class="ri-ans">${ansHtml}</div>
        </div>
        <div class="ri-icon">${isRight ? '✅' : '❌'}</div>
      </div>`;
  }).join('');

  resultSec.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Your Result</div>
        <div class="score-display">${correct}<sub> / ${questions.length}</sub></div>
        <div class="score-percent">${pct}% correct — ${gradeMsg}</div>
        <span class="grade-badge ${gradeClass}">${grade}</span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val c">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-val w">${wrong}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat-box"><div class="stat-val s">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div class="review-title">Answer Review</div>
      <div class="review-list">${reviewItems}</div>
      <button class="retry-btn" onclick="retryExam()">↺ Retry Exam</button>
    </div>`;

  resultSec.style.display = 'block';
  resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryExam() {
  userAnswers.fill(null);
  answered = 0;
  examDone = false;
  updateProgress();
  resultSec.style.display = 'none';
  resultSec.innerHTML = '';
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(el => el.classList.remove('answered'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuestions();
</script>
</body>
</html>
