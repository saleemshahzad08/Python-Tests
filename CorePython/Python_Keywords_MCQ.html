<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Keywords — MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #f7c948;
    --accent2: #4af0b0;
    --accent3: #f04a7a;
    --text: #e8eaf0;
    --muted: #6b7394;
    --correct: #4af0b0;
    --wrong: #f04a7a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(247,201,72,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(74,240,176,0.05) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown .6s ease both;
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(247,201,72,.3);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
  }
  .topics {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .topics span { color: var(--accent2); opacity: .8; }

  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown .6s .1s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta span:last-child { color: var(--accent); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 16px;
    animation: slideUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .question-card.answered::before { opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .q-code {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 22px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s ease;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(247,201,72,.06);
    transform: translateX(4px);
  }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text { font-size: 14.5px; line-height: 1.5; }
  .option.selected { border-color: var(--accent); background: rgba(247,201,72,.08); }
  .option.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #000; }

  #result-section { display: none; animation: slideUp .5s ease both; margin-top: 24px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,201,72,.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .score-display {
    font-size: clamp(52px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .score-display sub { font-size: 28px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .score-percent { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .grade-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .grade-A { background: rgba(74,240,176,.15); color: var(--correct); border: 1px solid rgba(74,240,176,.3); }
  .grade-B { background: rgba(247,201,72,.15); color: var(--accent); border: 1px solid rgba(247,201,72,.3); }
  .grade-C { background: rgba(240,74,122,.15); color: var(--wrong); border: 1px solid rgba(240,74,122,.3); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

  .review-title {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  }
  .review-list { display: flex; flex-direction: column; gap: 10px; }
  .review-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  }
  .review-item.correct { border-color: rgba(74,240,176,.25); }
  .review-item.wrong   { border-color: rgba(240,74,122,.2); }
  .ri-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); padding-top: 1px; }
  .ri-body { font-size: 13.5px; line-height: 1.5; }
  .ri-q { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .ri-ans { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .ri-ans .your  { color: var(--wrong); }
  .ri-ans .right { color: var(--correct); }
  .ri-ans .ok    { color: var(--correct); }
  .ri-icon { font-size: 18px; padding-top: 1px; }

  .retry-btn {
    margin-top: 32px; width: 100%; padding: 16px; background: var(--accent); color: #000;
    border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .04em; transition: all .2s;
  }
  .retry-btn:hover { background: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,201,72,.25); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .question-card { padding: 22px 18px; }
    .stats-row { gap: 8px; }
    .result-card { padding: 28px 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">🐍 Python Keywords</div>
    <h1>Intermediate<br><span>MCQ Test</span></h1>
    <p class="subtitle">30 questions · one correct answer each</p>
    <p class="topics"><span>True / False / None</span> · <span>scope</span> · <span>exceptions</span> · <span>generators</span> · <span>imports</span> · <span>lambda</span> · <span>async</span></p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">0 / 30 answered</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="questions-container"></div>
  <div id="result-section"></div>

</div>

<script>
const questions = [
  {
    q: "How many keywords does Python 3.11 have, and which of the following is NOT all lowercase?",
    opts: [
      "33 keywords; 'None' is not lowercase",
      "35 keywords; 'True' and 'False' are not all lowercase",
      "35 keywords; all keywords are fully lowercase",
      "30 keywords; 'True', 'False', and 'None' are not lowercase"
    ],
    ans: 1
  },
  {
    q: "What will the following code raise?",
    code: "class = 'Biology'\nprint(class)",
    opts: ["NameError", "TypeError", "SyntaxError", "ValueError"],
    ans: 2
  },
  {
    q: "What is the result of the following?",
    code: "print(True + True + False)\nprint(True * 5)",
    opts: ["2 and 5", "True and True", "2 and True", "True and 5"],
    ans: 0
  },
  {
    q: "Which of the following is the correct way to check if a variable holds None?",
    opts: [
      "if x == None:",
      "if x is not None:",
      "if x is None:",
      "if not x:"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "def greet():\n    pass\nresult = greet()\nprint(result is None)",
    opts: ["False", "pass", "None", "True"],
    ans: 3
  },
  {
    q: "What is the key difference between the global and nonlocal keywords?",
    opts: [
      "global modifies module-level variables; nonlocal modifies variables in the nearest enclosing function scope",
      "nonlocal modifies module-level variables; global modifies enclosing function variables",
      "Both global and nonlocal refer to the module-level scope",
      "global is used in classes; nonlocal is used in nested functions only for reading"
    ],
    ans: 0
  },
  {
    q: "What will the following code output?",
    code: "x = 10\ndef outer():\n    x = 20\n    def inner():\n        nonlocal x\n        x = 30\n    inner()\n    print(x)\nouter()",
    opts: ["10", "20", "30", "UnboundLocalError"],
    ans: 2
  },
  {
    q: "Which keyword is used to manually trigger an exception in Python?",
    opts: ["throw", "except", "assert", "raise"],
    ans: 3
  },
  {
    q: "What is the output of the following?",
    code: "try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print('Error')\nfinally:\n    print('Done')",
    opts: [
      "Error only",
      "Done only",
      "Error Done",
      "Error and then ZeroDivisionError is re-raised"
    ],
    ans: 2
  },
  {
    q: "What does the assert keyword do when its condition is False?",
    code: "assert len([]) > 0, 'List is empty'",
    opts: [
      "Raises ValueError with the message",
      "Raises AssertionError with the message",
      "Prints the message and continues",
      "Raises SyntaxError"
    ],
    ans: 1
  },
  {
    q: "What is the key difference between yield and return in a function?",
    opts: [
      "return pauses function execution; yield ends it permanently",
      "yield pauses execution and preserves state; return ends the function permanently",
      "Both yield and return terminate the function and send back a value",
      "yield can only be used in async functions"
    ],
    ans: 1
  },
  {
    q: "What is the primary advantage of using the with keyword when opening a file?",
    opts: [
      "It reads the file faster than open()",
      "It automatically closes the file even if an exception occurs",
      "It prevents other programs from opening the same file",
      "It converts the file contents to a string automatically"
    ],
    ans: 1
  },
  {
    q: "Which of the following identifiers is INVALID in Python?",
    opts: ["_my_var", "var_1", "2fast", "__init__"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "x = 5\ndef modify():\n    global x\n    x = 99\nmodify()\nprint(x)",
    opts: ["5", "None", "UnboundLocalError", "99"],
    ans: 3
  },
  {
    q: "What will happen if you use nonlocal on a variable that does NOT exist in any enclosing function scope?",
    opts: [
      "Python creates the variable in the module scope",
      "Python creates the variable in the local scope",
      "SyntaxError is raised",
      "NameError is raised at runtime"
    ],
    ans: 2
  },
  {
    q: "What is the difference between 'import math' and 'from math import sqrt'?",
    opts: [
      "import math imports the entire module; from math import sqrt imports only sqrt, accessible without the math. prefix",
      "Both import the entire module but from gives it a shorter alias",
      "from math import sqrt is slower because it loads the whole module first",
      "import math only imports constants; from imports functions"
    ],
    ans: 0
  },
  {
    q: "Which of the following correctly checks if a string is a Python keyword?",
    code: "word = 'while'",
    opts: [
      "word in dir(__builtins__)",
      "keyword.iskeyword(word)",
      "isinstance(word, keyword)",
      "word.iskeyword()"
    ],
    ans: 1
  },
  {
    q: "What is the output of the following?",
    code: "x = 0\ndef check():\n    x += 1\n    print(x)\ncheck()",
    opts: ["1", "0", "None", "UnboundLocalError"],
    ans: 3
  },
  {
    q: "Which keyword turns a regular function into a generator function?",
    opts: ["return", "async", "yield", "lambda"],
    ans: 2
  },
  {
    q: "What is the result of the following?",
    code: "result = (lambda x, y: x if x > y else y)(8, 12)\nprint(result)",
    opts: ["8", "True", "12", "SyntaxError"],
    ans: 2
  },
  {
    q: "What happens to the finally block when a try block raises an unhandled exception?",
    opts: [
      "The finally block is skipped",
      "The finally block runs before the exception propagates",
      "The finally block runs and suppresses the exception",
      "The finally block only runs if the exception is caught by except"
    ],
    ans: 1
  },
  {
    q: "Which of the following is a valid identifier in Python?",
    opts: ["my-var", "my var", "@myvar", "_my_var_1"],
    ans: 3
  },
  {
    q: "What does the as keyword do in the following statement?",
    code: "import numpy as np",
    opts: [
      "It imports only the np function from numpy",
      "It creates an alias np for the numpy module",
      "It renames the numpy module permanently",
      "It imports numpy into the np namespace only"
    ],
    ans: 1
  },
  {
    q: "Which category does the keyword 'assert' belong to?",
    opts: [
      "Function & Class Keywords",
      "Import & Module Keywords",
      "Control Flow Keywords",
      "Scope & Namespace Keywords"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "nums = [1, 2, 3]\ndef modify():\n    nums.append(4)\nmodify()\nprint(nums)",
    opts: [
      "[1, 2, 3]",
      "UnboundLocalError",
      "[1, 2, 3, 4]",
      "Requires global nums to work"
    ],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "print(False == 0)\nprint(None == False)",
    opts: ["True and True", "False and False", "True and False", "False and True"],
    ans: 2
  },
  {
    q: "Which of the following about the del keyword is TRUE?",
    opts: [
      "del empties a variable but keeps the name accessible",
      "del on a list element shifts all elements to the right",
      "After del x, accessing x raises NameError",
      "del cannot be used on dictionary keys"
    ],
    ans: 2
  },
  {
    q: "What constraint applies when using the await keyword?",
    opts: [
      "await can be used in any regular function",
      "await can only be used inside a function defined with async def",
      "await is only valid at the module (top) level",
      "await requires the threading module to be imported first"
    ],
    ans: 1
  },
  {
    q: "What is the difference between the keywords elif and else?",
    opts: [
      "elif can appear multiple times with a condition; else has no condition and runs if all previous checks failed",
      "else can appear multiple times; elif runs only once",
      "Both elif and else require a condition to be specified",
      "elif always runs; else only runs when elif is True"
    ],
    ans: 0
  },
  {
    q: "Which of the following statements about lambda is TRUE?",
    opts: [
      "lambda functions can contain multiple expressions separated by semicolons",
      "lambda functions require an explicit return statement",
      "lambda is limited to a single expression and implicitly returns its value",
      "lambda functions can contain if-elif-else blocks like a regular function"
    ],
    ans: 2
  }
];

const labels = ['A','B','C','D'];
const userAnswers = new Array(questions.length).fill(null);
let answered = 0;
let examDone = false;

const container = document.getElementById('questions-container');
const resultSec = document.getElementById('result-section');
const progFill  = document.getElementById('progress-fill');
const progLabel = document.getElementById('prog-label');
const progPct   = document.getElementById('prog-pct');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildQuestions() {
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const optsHtml = q.opts.map((opt, oi) => `
      <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${labels[oi]}</div>
        <div class="option-text">${escHtml(opt)}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${escHtml(q.q)}</div>
      ${codeBlock}
      <div class="options" id="opts-${qi}">${optsHtml}</div>`;
    container.appendChild(card);
  });
}

function selectOption(qi, oi) {
  if (examDone) return;
  const wasNull = userAnswers[qi] === null;
  userAnswers[qi] = oi;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.remove('selected');
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`card-${qi}`).classList.add('answered');

  if (wasNull) answered++;
  updateProgress();

  if (answered === questions.length) {
    examDone = true;
    setTimeout(showResult, 400);
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = `${answered} / ${questions.length} answered`;
  progPct.textContent = pct + '%';
}

function showResult() {
  let correct = 0;
  questions.forEach((q, i) => { if (userAnswers[i] === q.ans) correct++; });
  const wrong = questions.length - correct;
  const pct = Math.round((correct / questions.length) * 100);

  let grade, gradeClass, gradeMsg;
  if (pct >= 80)      { grade = '🏆 Excellent'; gradeClass = 'grade-A'; gradeMsg = 'Outstanding performance!'; }
  else if (pct >= 60) { grade = '✅ Good';       gradeClass = 'grade-B'; gradeMsg = 'Solid understanding!'; }
  else                { grade = '📚 Keep Going'; gradeClass = 'grade-C'; gradeMsg = 'More practice needed.'; }

  const reviewItems = questions.map((q, i) => {
    const isRight = userAnswers[i] === q.ans;
    const userLetter = labels[userAnswers[i]];
    const corrLetter = labels[q.ans];
    const qShort = q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q;
    const ansHtml = isRight
      ? `<span class="ok">✓ ${userLetter}: ${escHtml(q.opts[userAnswers[i]])}</span>`
      : `<span class="your">✗ You: ${userLetter} — ${escHtml(q.opts[userAnswers[i]])}</span><br><span class="right">✓ Correct: ${corrLetter} — ${escHtml(q.opts[q.ans])}</span>`;
    return `
      <div class="review-item ${isRight ? 'correct' : 'wrong'}">
        <div class="ri-num">Q${i+1}</div>
        <div class="ri-body">
          <div class="ri-q">${escHtml(qShort)}</div>
          <div class="ri-ans">${ansHtml}</div>
        </div>
        <div class="ri-icon">${isRight ? '✅' : '❌'}</div>
      </div>`;
  }).join('');

  resultSec.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Your Result</div>
        <div class="score-display">${correct}<sub> / ${questions.length}</sub></div>
        <div class="score-percent">${pct}% correct — ${gradeMsg}</div>
        <span class="grade-badge ${gradeClass}">${grade}</span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val c">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-val w">${wrong}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat-box"><div class="stat-val s">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div class="review-title">Answer Review</div>
      <div class="review-list">${reviewItems}</div>
      <button class="retry-btn" onclick="retryExam()">↺ Retry Exam</button>
    </div>`;

  resultSec.style.display = 'block';
  resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryExam() {
  userAnswers.fill(null);
  answered = 0;
  examDone = false;
  updateProgress();
  resultSec.style.display = 'none';
  resultSec.innerHTML = '';
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(el => el.classList.remove('answered'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuestions();
</script>
</body>
</html>
