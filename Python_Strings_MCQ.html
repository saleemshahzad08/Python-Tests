<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Strings — MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #f7c948;
    --accent2: #4af0b0;
    --accent3: #f04a7a;
    --text: #e8eaf0;
    --muted: #6b7394;
    --correct: #4af0b0;
    --wrong: #f04a7a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(247,201,72,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(74,240,176,0.05) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeDown .6s ease both;
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(247,201,72,.3);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
  }
  .topics {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .topics span { color: var(--accent2); opacity: .8; }

  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown .6s .1s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-meta span:last-child { color: var(--accent); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    margin-bottom: 16px;
    animation: slideUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .question-card.answered::before { opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .q-code {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 22px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s ease;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(247,201,72,.06);
    transform: translateX(4px);
  }
  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text { font-size: 14.5px; line-height: 1.5; }
  .option.selected { border-color: var(--accent); background: rgba(247,201,72,.08); }
  .option.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #000; }

  #result-section { display: none; animation: slideUp .5s ease both; margin-top: 24px; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,201,72,.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .score-display {
    font-size: clamp(52px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .score-display sub { font-size: 28px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .score-percent { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .grade-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .grade-A { background: rgba(74,240,176,.15); color: var(--correct); border: 1px solid rgba(74,240,176,.3); }
  .grade-B { background: rgba(247,201,72,.15); color: var(--accent); border: 1px solid rgba(247,201,72,.3); }
  .grade-C { background: rgba(240,74,122,.15); color: var(--wrong); border: 1px solid rgba(240,74,122,.3); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

  .review-title {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
  }
  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .review-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .review-item.correct { border-left: 3px solid var(--correct); }
  .review-item.wrong { border-left: 3px solid var(--wrong); }
  .ri-num {
    flex-shrink: 0; width: 36px; height: 36px;
    background: var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  }
  .ri-body { flex: 1; }
  .ri-q { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .ri-ans { font-size: 13px; line-height: 1.6; }
  .ri-ans .ok { color: var(--correct); }
  .ri-ans .your { color: var(--wrong); }
  .ri-ans .right { color: var(--correct); }
  .ri-icon { font-size: 18px; flex-shrink: 0; }

  .retry-btn {
    width: 100%; padding: 14px;
    background: var(--accent); color: #000;
    border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .retry-btn:hover { background: var(--accent2); transform: translateY(-2px); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    body { padding: 24px 16px 60px; }
    .question-card { padding: 24px 20px; }
    .result-card { padding: 32px 24px; }
    .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">Intermediate Level</div>
    <h1>Python <span>Strings</span></h1>
    <div class="subtitle">30-Question MCQ Assessment</div>
    <div class="topics">Topics: <span>Indexing • Slicing • Methods • Formatting • Comparison • Type Conversion • Escape Chars</span></div>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">0 / 30 answered</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="questions-container"></div>
  <div id="result-section"></div>
</div>

<script>
const questions = [
  {
    q: "Which of the following best describes Python strings?",
    opts: [
      "Mutable sequences of characters that can be edited in place",
      "Immutable sequences of characters where operations return new strings",
      "Mutable objects similar to lists but containing only characters",
      "Fixed-size arrays of single characters like in C"
    ],
    ans: 1
  },
  {
    q: "What will the following code output?",
    code: "s = 'Python'\nprint(s[-1])",
    opts: ["P", "y", "n", "o"],
    ans: 2
  },
  {
    q: "What will be the result of this expression?",
    code: "s = 'Hello'\ns[0] = 'J'\nprint(s)",
    opts: ["'Jello'", "'Hello'", "TypeError", "AttributeError"],
    ans: 2
  },
  {
    q: "What does the following slice return?",
    code: "s = 'Programming'\nprint(s[1:4])",
    opts: ["'Pro'", "'rog'", "'rogr'", "'Prog'"],
    ans: 1
  },
  {
    q: "What is the output of this code?",
    code: "s = 'Hello World'\nprint(s[::-1])",
    opts: ["'Hello World'", "'dlroW olleH'", "'World Hello'", "IndexError"],
    ans: 1
  },
  {
    q: "Which method splits a string into a list using a comma as the delimiter?",
    opts: ["s.split()", "s.split(',')", "s.divide(',')", "s.separate(',')"],
    ans: 1
  },
  {
    q: "What will the following print?",
    code: "words = ['Python', 'is', 'fun']\nprint('-'.join(words))",
    opts: ["'Python is fun'", "'Python-is-fun'", "['Python', 'is', 'fun']", "TypeError"],
    ans: 1
  },
  {
    q: "What is the difference between find() and index() when a substring is not found?",
    opts: [
      "Both return -1",
      "find() returns -1; index() raises ValueError",
      "find() raises ValueError; index() returns -1",
      "Both raise ValueError"
    ],
    ans: 1
  },
  {
    q: "What will this code output?",
    code: "s = ' Hello World '\nprint(s.strip())",
    opts: ["' Hello World '", "'Hello World '", "'Hello World'", "'HelloWorld'"],
    ans: 2
  },
  {
    q: "Which string method capitalizes the first letter of every word?",
    opts: ["capitalize()", "upper()", "title()", "startswith()"],
    ans: 2
  },
  {
    q: "What is the output of the following?",
    code: "name = 'Alice'\nage = 30\nprint(f'{name} is {age} years old')",
    opts: [
      "'{name} is {age} years old'",
      "'Alice is 30 years old'",
      "f'Alice is 30 years old'",
      "NameError"
    ],
    ans: 1
  },
  {
    q: "What does the following return?",
    code: "s = 'banana'\nprint(s.count('a'))",
    opts: ["1", "2", "3", "4"],
    ans: 2
  },
  {
    q: "What will this expression evaluate to?",
    code: "print('apple' < 'banana')",
    opts: ["False", "True", "TypeError", "None"],
    ans: 1
  },
  {
    q: "Which of the following correctly converts the binary string '1010' to an integer?",
    opts: ["int('1010')", "int('1010', 2)", "bin('1010')", "int('1010', 10)"],
    ans: 1
  },
  {
    q: "What is the output of this code?",
    code: "s = 'Hello'\nprint(s.replace('l', 'r'))",
    opts: ["'Herlo'", "'Helro'", "'Herro'", "'Herr0'"],
    ans: 2
  },
  {
    q: "What does the raw string r'\\n\\t' do with the backslash sequences?",
    opts: [
      "Interprets \\n as newline and \\t as tab",
      "Treats \\n and \\t as literal backslash-n and backslash-t",
      "Raises a SyntaxError",
      "Converts them to Unicode escape sequences"
    ],
    ans: 1
  },
  {
    q: "What will the following code print?",
    code: "s = 'Python'\nprint(s[0:10:2])",
    opts: ["'Pyt'", "'Pto'", "'yhn'", "IndexError"],
    ans: 1
  },
  {
    q: "What does isdigit() return for the string '123abc'?",
    opts: ["True", "False", "123", "TypeError"],
    ans: 1
  },
  {
    q: "What is the output of this expression?",
    code: "print('Ha' * 3)",
    opts: ["'Ha Ha Ha'", "'HaHaHa'", "['Ha', 'Ha', 'Ha']", "TypeError"],
    ans: 1
  },
  {
    q: "Which of the following f-string expressions formats the float 3.14159 to 2 decimal places?",
    opts: ["f'{3.14159:2f}'", "f'{3.14159:.2}'", "f'{3.14159:.2f}'", "f'{3.14159,2f}'"],
    ans: 2
  },
  {
    q: "What will the following code output?",
    code: "s = 'hello world'\nprint(s.startswith('hello'))",
    opts: ["False", "0", "True", "None"],
    ans: 2
  },
  {
    q: "Which of the following would correctly count the number of non-space characters in a string s?",
    opts: ["len(s)", "len(s.strip())", "len(s.replace(' ', ''))", "s.count('')"],
    ans: 2
  },
  {
    q: "What will the following print?",
    code: "for i, ch in enumerate('ABC'):\n    print(i, ch)",
    opts: [
      "1 A\\n2 B\\n3 C",
      "0 A\\n1 B\\n2 C",
      "A 0\\nB 1\\nC 2",
      "('A',0) ('B',1) ('C',2)"
    ],
    ans: 1
  },
  {
    q: "What does the following expression return?",
    code: "print('Geeks' in 'GeeksForGeeks')",
    opts: ["False", "0", "True", "TypeError"],
    ans: 2
  },
  {
    q: "What will int('42abc') raise?",
    opts: ["TypeError", "ValueError", "SyntaxError", "AttributeError"],
    ans: 1
  },
  {
    q: "What does zfill(5) do to the string '42'?",
    opts: ["'42 '", "' 42'", "'00042'", "'42000'"],
    ans: 2
  },
  {
    q: "What will the following slice return?",
    code: "s = 'abcdefgh'\nprint(s[0:8:3])",
    opts: ["'abc'", "'adg'", "'beh'", "'ace'"],
    ans: 1
  },
  {
    q: "Which of the following string comparisons performs a case-insensitive equality check?",
    opts: [
      "s1 == s2",
      "s1.casefold() == s2.casefold()",
      "s1.upper() is s2.upper()",
      "s1.compare(s2)"
    ],
    ans: 1
  },
  {
    q: "What is the result of this expression?",
    code: "print(len('Hello World'))",
    opts: ["10", "11", "9", "12"],
    ans: 1
  },
  {
    q: "What will list('Hello') return?",
    opts: [
      "['Hello']",
      "['H', 'e', 'l', 'l', 'o']",
      "('H', 'e', 'l', 'l', 'o')",
      "{'H', 'e', 'l', 'o'}"
    ],
    ans: 1
  }
];

const labels = ['A','B','C','D'];
const userAnswers = new Array(questions.length).fill(null);
let answered = 0;
let examDone = false;

const container = document.getElementById('questions-container');
const resultSec = document.getElementById('result-section');
const progFill  = document.getElementById('progress-fill');
const progLabel = document.getElementById('prog-label');
const progPct   = document.getElementById('prog-pct');

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildQuestions() {
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.03}s`;

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const optsHtml = q.opts.map((opt, oi) => `
      <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="option-letter">${labels[oi]}</div>
        <div class="option-text">${escHtml(opt)}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${escHtml(q.q)}</div>
      ${codeBlock}
      <div class="options" id="opts-${qi}">${optsHtml}</div>`;
    container.appendChild(card);
  });
}

function selectOption(qi, oi) {
  if (examDone) return;
  const wasNull = userAnswers[qi] === null;
  userAnswers[qi] = oi;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.remove('selected');
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`card-${qi}`).classList.add('answered');

  if (wasNull) answered++;
  updateProgress();

  if (answered === questions.length) {
    examDone = true;
    setTimeout(showResult, 400);
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = `${answered} / ${questions.length} answered`;
  progPct.textContent = pct + '%';
}

function showResult() {
  let correct = 0;
  questions.forEach((q, i) => { if (userAnswers[i] === q.ans) correct++; });
  const wrong = questions.length - correct;
  const pct = Math.round((correct / questions.length) * 100);

  let grade, gradeClass, gradeMsg;
  if (pct >= 80)      { grade = '🏆 Excellent'; gradeClass = 'grade-A'; gradeMsg = 'Outstanding performance!'; }
  else if (pct >= 60) { grade = '✅ Good';       gradeClass = 'grade-B'; gradeMsg = 'Solid understanding!'; }
  else                { grade = '📚 Keep Going'; gradeClass = 'grade-C'; gradeMsg = 'More practice needed.'; }

  const reviewItems = questions.map((q, i) => {
    const isRight = userAnswers[i] === q.ans;
    const userLetter = labels[userAnswers[i]];
    const corrLetter = labels[q.ans];
    const qShort = q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q;
    const ansHtml = isRight
      ? `<span class="ok">✓ ${userLetter}: ${escHtml(q.opts[userAnswers[i]])}</span>`
      : `<span class="your">✗ You: ${userLetter} — ${escHtml(q.opts[userAnswers[i]])}</span><br><span class="right">✓ Correct: ${corrLetter} — ${escHtml(q.opts[q.ans])}</span>`;
    return `
      <div class="review-item ${isRight ? 'correct' : 'wrong'}">
        <div class="ri-num">Q${i+1}</div>
        <div class="ri-body">
          <div class="ri-q">${escHtml(qShort)}</div>
          <div class="ri-ans">${ansHtml}</div>
        </div>
        <div class="ri-icon">${isRight ? '✅' : '❌'}</div>
      </div>`;
  }).join('');

  resultSec.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Your Result</div>
        <div class="score-display">${correct}<sub> / ${questions.length}</sub></div>
        <div class="score-percent">${pct}% correct — ${gradeMsg}</div>
        <span class="grade-badge ${gradeClass}">${grade}</span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val c">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-val w">${wrong}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat-box"><div class="stat-val s">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div class="review-title">Answer Review</div>
      <div class="review-list">${reviewItems}</div>
      <button class="retry-btn" onclick="retryExam()">↺ Retry Exam</button>
    </div>`;

  resultSec.style.display = 'block';
  resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryExam() {
  userAnswers.fill(null);
  answered = 0;
  examDone = false;
  updateProgress();
  resultSec.style.display = 'none';
  resultSec.innerHTML = '';
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(el => el.classList.remove('answered'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuestions();
</script>
</body>
</html>
